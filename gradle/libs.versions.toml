[versions]
# Build — AGP 9 (Kotlin integre a AGP : plus de plugin `org.jetbrains.kotlin.android`).
# Migre le 2026-09-16, sur le modele d'Agenda Tech, dont l'entree 1.1.1 (57) a passe le job
# `fdroid build` de leur pipeline avec cette meme chaine — AGP 9.4, Gradle 9.7.1, compileSdk 37.
agp = "9.5.0"
# Kotlin plafonne SOUS 2.4.20 : CodeQL 2.27 refuse de compiler a partir de la (« Kotlin version
# 2.4.20 is too recent »), mesure sur Agenda Tech. `codeql.yml` tourne aussi sur ce depot.
kotlin = "2.4.10"
ksp = "2.3.12"
java = "17"

# AndroidX / Compose
compose-bom = "2026.09.00"
core-ktx = "1.19.1"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
navigation-compose = "2.9.8"
datastore = "1.3.0"
room = "2.8.5"
work = "2.12.0"
biometric = "1.1.0"
splashscreen = "1.2.0"
documentfile = "1.1.0"
# v1.14.8 audit SEC-M4 — `androidx.security:security-crypto:1.1.0-alpha06` retiré
# (alpha 2021, 0 usage confirmé). Lib + alias [androidx-security-crypto] désormais inertes.
# security-crypto = "1.1.0-alpha06"

# Hilt — 2.59+ exige AGP 9.0.0+, et c'etait LE mur de la migration : aucune version de Hilt ne
# lisait les metadonnees Kotlin 2.4 en acceptant AGP 8 (mesure le 2026-09-08, quatre combinaisons).
# AGP 9 leve exactement ce mur.
hilt = "2.60.1"
hilt-work = "1.4.0"
hilt-navigation-compose = "1.4.0"

# Coil
coil = "2.7.0"
# AndroidSVG — same 1.4 coil-svg 2.7.0 brings in, but coil-svg declares it
# runtime-only, so TwemojiAssets (which imports com.caverock.androidsvg.SVG
# directly to render stickers) needs this direct dependency on the compile
# classpath. Without it CI fails at :app:compileDebugKotlin.
androidsvg = "1.4"

# Accompanist
accompanist = "0.37.3"

# Coroutines
coroutines = "1.11.0"

# Serialization
kotlinx-serialization = "1.12.0"

# SQLCipher
sqlcipher = "4.19.0"

# Slice 1 — phone <-> desktop linking over the local network. All four are
# local open-source libraries with no network use and no telemetry (the
# app's no-tracking rule): Ktor is a local server framework, CameraX is a
# local camera wrapper, ZXing core decodes QR codes on-device, and
# BouncyCastle does crypto on-device. No Play Services, no Firebase, no
# analytics — ZXing core is used INSTEAD of ML Kit barcode scanning for
# exactly that reason (the phone has no Play Services).
ktor = "3.6.1"
# Netty version is Ktor 3.6.1's own (see ktor-server-netty's pom) — the
# -classes- artifacts below must match it exactly.
netty = "4.2.17.Final"
camerax = "1.6.2"
zxing = "3.5.4"
bouncycastle = "1.87"

# Logging
timber = "5.0.1"

# v1.7.0 — ML Kit (mlkit-translate + mlkit-language-id) removed for F-Droid
# FLOSS compliance (was flagged AntiFeatures: NonFreeDep on MR !38458).
# Translation feature temporarily disabled in UI ; full FLOSS replacement
# (fastText lid.176 + Marian MT via ONNX Runtime) planned for v1.8.x.

# Tests
junit = "4.13.2"
junit5 = "5.11.3"
# Gradle 9 ne fournit plus le lanceur de la plateforme JUnit : sans lui, la tache de test echoue
# sur « Failed to load JUnit Platform » AVANT le premier test. La plateforme garde sa propre
# numerotation tant qu'on reste en JUnit 5 — Jupiter 5.11.3 <-> plateforme 1.11.3.
junit-platform = "1.11.3"
mockk = "1.14.11"
turbine = "1.2.1"
truth = "1.4.5"
robolectric = "4.17"
androidx-test-ext = "1.2.1"
androidx-test-runner = "1.7.0"
espresso = "3.7.0"

# Quality
detekt = "1.23.8"
# baselineprofile/benchmark 1.5.0 : la 1.3.4 refuse AGP 9 (« Module `:app` is not a supported
# android module », mesure le 2026-09-16). Le plugin et la bibliotheque macrobenchmark partagent
# volontairement la meme reference — les desaccorder est une panne classique.
benchmark = "1.5.0"
profileinstaller = "1.4.1"
uiautomator = "2.4.0"
ktlint-gradle = "14.2.0"

[libraries]
# AndroidX core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
# v1.14.8 — alias retiré (dépendance alpha non utilisée).
# androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }

# Compose
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# Navigation
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }

# DataStore
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# WorkManager
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# Biometric
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "hilt-work" }
hilt-work-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hilt-work" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }

# Coil
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
coil-video = { module = "io.coil-kt:coil-video", version.ref = "coil" }
coil-svg = { module = "io.coil-kt:coil-svg", version.ref = "coil" }
coil-gif = { module = "io.coil-kt:coil-gif", version.ref = "coil" }
# Direct: see the version note above — coil-svg's copy is runtime-only.
androidsvg = { module = "com.caverock:androidsvg-aar", version.ref = "androidsvg" }

# Accompanist
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
# v1.7.0 — kotlinx-coroutines-play-services retiré (était bridge ML Kit Task→suspend).
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# JSR-330 — annotations @Inject/@Singleton pour le module :core (sans dépendre de Hilt/dagger)
javax-inject = { module = "javax.inject:javax.inject", version = "1" }

# Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# Runtime -core (KSerializer / descriptors / encoding) pour les serializers custom du module :domain
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }

# SQLCipher
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }

# Slice 1 — phone <-> desktop linking (LAN server + QR pairing). Direct
# dependencies: every one of these is imported directly by sync code, and
# the local harness masks a missing direct dep (a transitive copy compiles
# locally but CI fails) — see the AndroidSVG note above.
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
# Netty, NOT CIO: Ktor 3.x's CIO server engine has no HTTPS support at all —
# it throws UnsupportedOperationException on any sslConnector (proven on
# device 2026-11-13: the app crashed the moment the server started). Netty
# is the engine with TLS + WebSocket support; Apache-2.0, no telemetry.
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
# Netty 4.2 split the native transports: the plain -epoll/-kqueue
# artifacts are EMPTY shells (their classes live in per-platform
# classifier jars), and Ktor's engine calls KQueue.isAvailable() /
# Epoll.isAvailable() directly — without these two, engine start throws
# NoClassDefFoundError (proven by SyncEngineTlsTest, 2026-11-13). The
# -classes- artifacts carry the Java API only; isAvailable() is false
# on Android (no native lib is ever loaded), so the engine falls back
# to the pure-Java NIO transport, which is what we want.
netty-transport-classes-epoll = { module = "io.netty:netty-transport-classes-epoll", version.ref = "netty" }
netty-transport-classes-kqueue = { module = "io.netty:netty-transport-classes-kqueue", version.ref = "netty" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
camerax-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
# ZXing core, pure-Java QR decoding — no Play Services (see the version note above).
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
# BouncyCastle: Ed25519 verify below API 33 (java.security EdDSA is API 33+)
# and the self-signed-certificate fallback (bcpkix carries the X.509 builder).
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

# Logging
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# v1.7.0 — mlkit-translate + mlkit-language-id removed (F-Droid FLOSS).
# See comment in [versions] section above for migration plan.

# Tests
junit = { module = "junit:junit", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit5" }
# v1.27.2 — les tests unitaires de ce dépôt tournent sur la plateforme JUnit 5, or Hilt et
# Robolectric sont en JUnit 4 (`@RunWith`, `@Rule`). Le moteur vintage exécute ces classes-là sous
# la même plateforme, sans toucher aux ~40 fichiers Jupiter existants.
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

# Detekt
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
